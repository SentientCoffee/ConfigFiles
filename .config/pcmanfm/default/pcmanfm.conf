[config]
bm_open_method=1

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[autorun]
x-content/image-dcf=pcmanfm

[ui]
always_show_tabs=1
max_tab_chars=48
win_width=1839
win_height=2146
splitter_pos=210
media_in_new_tab=1
desktop_folder_new_win=0
change_tab_on_drop=1
close_on_unmount=1
focus_previous=1
side_pane_mode=places
view_mode=list
show_hidden=1
sort=name;ascending;
columns=name:200;desc:225;perm:131;size:90;mtime:2800;
toolbar=newtab;navigation;home;
show_statusbar=1
pathbar_mode_buttons=0
